<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 470' width='100%' role='img' aria-label='Fishbone DEFECT-001' font-family='Segoe UI, Arial, sans-serif'><title>Fishbone DEFECT-001</title><rect width='920' height='470' fill='#ffffff'/><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#7a8794'/></marker></defs><line x1='30' y1='235' x2='700' y2='235' stroke='#1b1b1b' stroke-width='3' marker-end='url(#a)'/><rect x='715.0' y='180.0' width='190' height='110' rx='5' fill='#fbe9e7' stroke='#b3261e'/><text x='810' y='218' font-size='11' text-anchor='middle' font-weight='bold' fill='#1b1b1b'>DEFECT-001</text><text x='810' y='232' font-size='11' text-anchor='middle' font-weight='normal' fill='#1b1b1b'>inactive event</text><text x='810' y='246' font-size='11' text-anchor='middle' font-weight='normal' fill='#1b1b1b'>still accepts</text><text x='810' y='260' font-size='11' text-anchor='middle' font-weight='normal' fill='#1b1b1b'>signup</text><line x1='160' y1='95' x2='230' y2='235' stroke='#7a8794' stroke-width='2'/><text x='160' y='28' font-size='13' text-anchor='middle' font-weight='bold' fill='#0b4f9e'>Code</text><text x='60' y='60' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>return instead of raise in one</text><text x='60' y='73' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>checker; inconsistent with</text><text x='60' y='86' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>siblings</text><line x1='375' y1='95' x2='445' y2='235' stroke='#7a8794' stroke-width='2'/><text x='375' y='28' font-size='13' text-anchor='middle' font-weight='bold' fill='#0b4f9e'>Tests</text><text x='275' y='60' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>line never executed by</text><text x='275' y='73' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>upstream tests; no negative</text><text x='275' y='86' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>test for inactive events</text><line x1='590' y1='95' x2='660' y2='235' stroke='#7a8794' stroke-width='2'/><text x='590' y='28' font-size='13' text-anchor='middle' font-weight='bold' fill='#0b4f9e'>Design</text><text x='490' y='60' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>error signalling relies on</text><text x='490' y='73' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>convention (exceptions</text><text x='490' y='86' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>collected by a loop), not</text><text x='490' y='99' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>types</text><line x1='160' y1='385' x2='230' y2='235' stroke='#7a8794' stroke-width='2'/><text x='160' y='450' font-size='13' text-anchor='middle' font-weight='bold' fill='#0b4f9e'>Process</text><text x='60' y='320' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>no mutation testing, no</text><text x='60' y='333' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>contract test, coverage not</text><text x='60' y='346' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>gated on this file</text><line x1='375' y1='385' x2='445' y2='235' stroke='#7a8794' stroke-width='2'/><text x='375' y='450' font-size='13' text-anchor='middle' font-weight='bold' fill='#0b4f9e'>Environment / data</text><text x='275' y='320' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>inactive events hidden in the</text><text x='275' y='333' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>UI hide the path from manual</text><text x='275' y='346' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>testing</text><line x1='590' y1='385' x2='660' y2='235' stroke='#7a8794' stroke-width='2'/><text x='590' y='450' font-size='13' text-anchor='middle' font-weight='bold' fill='#0b4f9e'>People</text><text x='490' y='320' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>defensive code written without</text><text x='490' y='333' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>a failing test first</text><text x='490' y='346' font-size='10.5' text-anchor='start' font-weight='normal' fill='#1b1b1b'>(inference)</text></svg>